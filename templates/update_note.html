{% extends "base.html" %}
{% block content %}
  <div class="card">
    <h2 class="text-center mb-4">✏️ Edit Note</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-custom w-100">✅ Update</button>
    </form>
    <div class="text-center mt-3">
      <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">← Back</a>
    </div>

    <!-- for tag and color -->
    <div class="mb-3">
  <label for="tag">🏷️ Tag</label>
  {{ form.tag }}
</div>

<div class="mb-3">
  <label for="color">🎨 Color</label>
  {{ form.color }}
</div>

  </div>
{% endblock %}
