
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

  <title>📒 Notes App</title>

</head>
<body>

    </div>
  </div>
{% endif %}

    {% block content %}{% endblock %} -->
  </div>

  <div class="container text-center mb-4">
